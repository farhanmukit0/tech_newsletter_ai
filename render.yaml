# Render Blueprint: one free web service. The database lives on Neon (free Postgres) because
# Render's free Postgres expires after 30 days and free web services have no persistent disk.
# Free services sleep after 15 minutes idle, so the in-process scheduler is off and
# .github/workflows/send.yml triggers issues instead.
services:
  - type: web
    name: the-kernel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: The Kernel <hello@thekernel.fyi>
      - key: BASE_URL
        value: https://thekernel.fyi
      - key: TIMEZONE
        value: America/New_York
      - key: EDITOR_MODEL
        value: claude-haiku-5-5
      - key: EDITOR_EFFORT
        value: medium
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BRAVE_API_KEY
        sync: false
