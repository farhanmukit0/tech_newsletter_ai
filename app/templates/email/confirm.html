<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your subscription</title></head>
<body style="margin:0; padding:0; background:#f3f1ec;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f1ec;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:520px; background:#fffefb; border:1px solid #e4e0d8;">
<tr><td style="padding:32px 36px; font-family: Georgia, 'Times New Roman', serif; color:#1b1b1b;">
  <div style="font-size:26px; font-weight:bold; letter-spacing:-0.4px; border-bottom:3px double #1b1b1b; padding-bottom:10px;">{{ name }}</div>
  <p style="font-size:17px; line-height:1.6; margin:22px 0 0;">One click and you're in. Confirm that this address should get the {{ cadence }} edition.</p>
  <p style="margin:24px 0;">
    <a href="{{ confirm_url }}" style="display:inline-block; background:#1b1b1b; color:#fffefb; font-family:-apple-system, 'Helvetica Neue', Arial, sans-serif; font-size:15px; font-weight:600; text-decoration:none; padding:12px 22px;">Confirm subscription</a>
  </p>
  <p style="font-family:-apple-system, 'Helvetica Neue', Arial, sans-serif; font-size:13px; line-height:1.6; color:#77726a; margin:0;">
    If the button doesn't work, paste this into your browser:<br><a href="{{ confirm_url }}" style="color:#5f5b54; word-break:break-all;">{{ confirm_url }}</a><br><br>
    Didn't sign up? Ignore this and you won't hear from us again.
  </p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
